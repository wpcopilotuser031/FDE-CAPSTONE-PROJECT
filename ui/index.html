<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Care Coordination Assistant</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <!-- ===================== LOGIN SCREEN ===================== -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Care Coordination Assistant</h1>
      <p class="login-subtitle">Sign in to chat with your AI referral assistant. Access is scoped to your role.</p>

      <div class="field-row">
        <label for="loginUsername">Username</label>
        <input id="loginUsername" type="text" autocomplete="username" placeholder="e.g., patient1" />
      </div>

      <div class="field-row">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" />
      </div>

      <button id="loginBtn" class="action-button primary">Sign In</button>
      <p id="loginError" class="login-error hidden"></p>

      <div class="demo-logins">
        <p class="demo-logins-title">Quick demo sign-in</p>
        <div class="demo-logins-row">
          <button type="button" class="demo-btn" data-username="patient1" data-password="Patient@123">🧑 Patient</button>
          <button type="button" class="demo-btn" data-username="provider1" data-password="Provider@123">🩺 Provider</button>
          <button type="button" class="demo-btn" data-username="careagent1" data-password="CareAgent@123">🛡️ Care Agent</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== CHAT SCREEN ===================== -->
  <div id="chatScreen" class="chat-screen hidden">
    <header class="chat-header">
      <div>
        <div class="chat-header-title">Care Coordination Assistant</div>
        <div class="chat-header-subtitle" id="roleBadge"></div>
      </div>
      <button id="logoutBtn" class="action-button secondary">Log out</button>
    </header>

    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-suggestions" id="chatSuggestions"></div>

    <form id="chatForm" class="chat-input-row">
      <textarea id="chatInput" rows="1" placeholder="Ask about referrals, specialists, insurance..." autocomplete="off"></textarea>
      <button id="chatSendBtn" class="action-button primary chat-send-btn" type="submit">Send</button>
    </form>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
