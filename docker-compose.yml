services:
  backend:
    build: .
    image: aviroopbasu1995/fde-capstone:backend
    container_name: referral-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8090
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      - USE_MCP_TOOLS=true
    restart: unless-stopped

  agent_runtime:
    build: .
    image: aviroopbasu1995/fde-capstone:agent-runtime
    container_name: referral-agent-runtime
    command: >-
      sh -c "python scripts/build_rag_index.py &&
             uvicorn app.agent_runtime:app --host 0.0.0.0 --port 8091"
    ports:
      - "8091:8091"
    env_file:
      - .env
    restart: unless-stopped

  mcp_gateway:
    build: .
    image: aviroopbasu1995/fde-capstone:mcp-gateway
    container_name: referral-mcp-gateway
    command: >-
      sh -c "python scripts/build_rag_index.py &&
             uvicorn app.mcp_gateway:app --host 0.0.0.0 --port 8092"
    ports:
      - "8092:8092"
    env_file:
      - .env
    restart: unless-stopped

  ui:
    image: nginx:stable-alpine
    container_name: referral-ui
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8093:80"
    restart: unless-stopped
